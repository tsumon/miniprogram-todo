<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">日历、周期、农历、应用内提醒</title>
  <desc id="desc">月视图带任务数徽标。切月时补全逾期的周期和生日；农历生日用 lunar.js（1900–2099）换成公历 dueDate，跨年自动续期。提醒不走微信订阅消息：打开小程序弹窗，标记完成才停，稍后则 30 分钟后再弹。</desc>

  <defs>
    <clipPath id="cal-clip">
      <rect width="1200" height="400" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cal-clip)">
    <rect width="1200" height="400" fill="#F3F5F8"/>

    <!-- Calendar specimen -->
    <g transform="translate(40 28)">
      <rect width="620" height="344" rx="20" fill="#FFFFFF"/>

      <circle cx="36" cy="36" r="16" fill="#F0F1F4"/>
      <text x="36" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" fill="#555555">‹</text>
      <text x="310" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="22" font-weight="700" fill="#2C2C2A">2026年9月</text>
      <circle cx="528" cy="36" r="16" fill="#F0F1F4"/>
      <text x="528" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" fill="#555555">›</text>
      <rect x="548" y="22" width="52" height="28" rx="14" fill="#EAF3FC"/>
      <text x="574" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="600" fill="#4A90D9">今天</text>

      <!-- Weekdays: 日 first, matching calendar.wxml -->
      <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="600">
        <text x="52" y="80" text-anchor="middle" fill="#E24B4A">日</text>
        <text x="136" y="80" text-anchor="middle" fill="#888888">一</text>
        <text x="220" y="80" text-anchor="middle" fill="#888888">二</text>
        <text x="304" y="80" text-anchor="middle" fill="#888888">三</text>
        <text x="388" y="80" text-anchor="middle" fill="#888888">四</text>
        <text x="472" y="80" text-anchor="middle" fill="#888888">五</text>
        <text x="556" y="80" text-anchor="middle" fill="#E24B4A">六</text>
      </g>

      <!-- Sep 2026 starts Tuesday. Each cell 84×48, origin (10, 96) -->
      <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="500" fill="#2C2C2A">
        <!-- row 0: 1-5 at cols 2-6 -->
        <text x="220" y="124" text-anchor="middle">1</text>
        <text x="304" y="124" text-anchor="middle">2</text>
        <text x="388" y="124" text-anchor="middle">3</text>
        <!-- today 4 -->
        <circle cx="472" cy="118" r="16" fill="#4A90D9"/>
        <text x="472" y="124" text-anchor="middle" fill="#FFFFFF" font-weight="700">4</text>
        <rect x="456" y="136" width="32" height="18" rx="9" fill="#4A90D9"/>
        <text x="472" y="149" text-anchor="middle" font-size="13" fill="#FFFFFF">3</text>
        <text x="556" y="124" text-anchor="middle" fill="#E24B4A">5</text>

        <!-- row 1: 6-12 -->
        <text x="52" y="176" text-anchor="middle" fill="#E24B4A">6</text>
        <text x="136" y="176" text-anchor="middle">7</text>
        <text x="220" y="176" text-anchor="middle">8</text>
        <rect x="204" y="188" width="32" height="18" rx="9" fill="#4A90D9"/>
        <text x="220" y="201" text-anchor="middle" font-size="13" fill="#FFFFFF">1</text>
        <text x="304" y="176" text-anchor="middle">9</text>
        <text x="388" y="176" text-anchor="middle">10</text>
        <rect x="372" y="188" width="32" height="18" rx="9" fill="#4A90D9"/>
        <text x="388" y="201" text-anchor="middle" font-size="13" fill="#FFFFFF">1</text>
        <text x="472" y="176" text-anchor="middle">11</text>
        <rect x="456" y="188" width="32" height="18" rx="9" fill="#4A90D9"/>
        <text x="472" y="201" text-anchor="middle" font-size="13" fill="#FFFFFF">1</text>
        <text x="556" y="176" text-anchor="middle" fill="#E24B4A">12</text>

        <!-- row 2: 13-19 -->
        <text x="52" y="228" text-anchor="middle" fill="#E24B4A">13</text>
        <text x="136" y="228" text-anchor="middle">14</text>
        <text x="220" y="228" text-anchor="middle">15</text>
        <text x="304" y="228" text-anchor="middle">16</text>
        <text x="388" y="228" text-anchor="middle">17</text>
        <text x="472" y="228" text-anchor="middle">18</text>
        <text x="556" y="228" text-anchor="middle" fill="#E24B4A">19</text>

        <!-- row 3: 20-26 -->
        <text x="52" y="280" text-anchor="middle" fill="#E24B4A">20</text>
        <text x="136" y="280" text-anchor="middle">21</text>
        <text x="220" y="280" text-anchor="middle">22</text>
        <text x="304" y="280" text-anchor="middle">23</text>
        <text x="388" y="280" text-anchor="middle">24</text>
        <text x="472" y="280" text-anchor="middle">25</text>
        <text x="556" y="280" text-anchor="middle" fill="#E24B4A">26</text>

        <!-- row 4: 27-30 -->
        <text x="52" y="332" text-anchor="middle" fill="#E24B4A">27</text>
        <text x="136" y="332" text-anchor="middle">28</text>
        <text x="220" y="332" text-anchor="middle">29</text>
        <text x="304" y="332" text-anchor="middle">30</text>
      </g>
    </g>

    <!-- Callouts: three real mechanisms -->
    <g transform="translate(688 28)">
      <rect width="472" height="104" rx="16" fill="#FFFFFF"/>
      <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#2C2C2A">周期引擎</text>
      <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="18" fill="#555555">日 / 周 / 月 / 季 / 年，可自定义间隔。</text>
      <text x="20" y="84" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16" fill="#888888">完成「每周五写周报」→ 自动生成下周五。</text>

      <g transform="translate(0 116)">
        <rect width="472" height="104" rx="16" fill="#FFFFFF"/>
        <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#2C2C2A">农历生日</text>
        <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="18" fill="#555555">八月初十 → lunar.js → 今年公历。</text>
        <text x="20" y="84" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16" fill="#888888">1900–2099。跨年续期，不用 yearly 硬套。</text>
      </g>

      <g transform="translate(0 232)">
        <rect width="472" height="104" rx="16" fill="#FFFFFF"/>
        <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#E24B4A">应用内提醒</text>
        <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="18" fill="#555555">打开小程序弹窗：标记完成才停。</text>
        <text x="20" y="84" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16" fill="#888888">稍后 = 30 分钟后再弹。订阅消息已弃用。</text>
      </g>
    </g>
  </g>
</svg>
